cradle:
  multi:
    - path: "./accelerate-llvm/src"
      config:
        cradle:
          stack:
            component: "accelerate-llvm:lib"
    - path: "./accelerate-llvm-native/src"
      config:
        cradle:
          stack:
            component: "accelerate-llvm-native:lib"
    - path: "./accelerate-llvm-native/test/nofib"
      config:
        cradle:
          stack:
            component: "accelerate-llvm-native:test:nofib-llvm-native"
    - path: "./accelerate-llvm-ptx"
      config:
        cradle:
          none:
    - path: "./icebox"
      config:
        cradle:
          none: